services:
  - type: web
    name: nutrichrono
    runtime: node
    plan: free
    buildCommand: npm install && npm --prefix client install && npm --prefix server install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
